name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            qt6-base-dev \
            qt6-declarative-dev

      - name: Run tests
        run: ./bin/test

      - name: Build Omawrite
        run: ./bin/build
